name: CI - Bai 4 Login GHCR

# Bài 4: Khai báo GitHub Secrets và cấu hình Đăng nhập Container Registry
# Kích hoạt khi push / PR vào main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Gradle & Login GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew

      - name: Chạy test Gradle
        run: ./gradlew test --info

      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
